spring.application.name=backend

# Server
server.port=8080
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

# PostgreSQL DB config
spring.datasource.url=jdbc:postgresql://localhost:5432/backendDB
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


google.web.client.id=${GOOGLE_WEB_CLIENT_ID}
nextauth.secret=${NEXTAUTH_SECRET}

# Mailgun
mailgun.api.key=${MAILGUNAPI}
mailgun.domain=${MAILGUNDOMAIN}
mailgun.base-url=https://api.mailgun.net


google.client.id=YOUR_GOOGLE_CLIENT_ID
google_web_client_id=GOOGLE_WEB_CLIENT_ID
google_ios_client_id=GOOGLE_IOS_CLIENT_ID
google.client.secret=YOUR_GOOGLE_CLIENT_SECRET
google.redirect.uri=http://localhost:8080/auth/google/callback
# Local default; set FRONTEND_REDIRECT_URL=https://www.themanagerlife.com in production.
frontend.redirect.url=${FRONTEND_REDIRECT_URL:http://localhost:3000}
app.cookie.secure=false
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:the-manager-life}
jwt.audience=${JWT_AUDIENCE:the-manager-life-api}
pin.lookup-secret=${PIN_LOOKUP_SECRET:}
pin.hash-pepper=${PIN_HASH_PEPPER:}
pin.offline-encryption-key=${PIN_OFFLINE_ENCRYPTION_KEY:}
pin.offline-encryption-key-version=${PIN_OFFLINE_ENCRYPTION_KEY_VERSION:1}
pin.action-token-secret=${PIN_ACTION_TOKEN_SECRET:}
pin.action-token-issuer=${PIN_ACTION_TOKEN_ISSUER:the-manager-life-pin}
pin.action-token-audience=${PIN_ACTION_TOKEN_AUDIENCE:the-manager-life-line-check}
pin.offline-bundle-hours=${PIN_OFFLINE_BUNDLE_HOURS:24}
apple.client.id=APPLE_CLIENT_ID
apple.team.id=APPLE_TEAM_ID
apple.key.id=APPLE_KEY_ID
apple.redirect.uri=https://app-javabackend-5e1ae1d5056c.herokuapp.com/auth/apple/callback
apple.private.key=APPLE_PRIVATE_KEY
AWS.ACCESS.KEY.ID=AWS_ACCESS_KEY
AWS.SECRET.ACCESS.KEY=AWS_SECRET_ACCESS_KEY
aws.region=AWS_REGION
aws.s3.bucket=AWS_S3_BUCKET
